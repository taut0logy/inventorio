[program:inventorio-messenger]
command=php /var/www/inventorio/bin/console messenger:consume async --time-limit=3600 -vv
directory=/var/www/inventorio
user=ubuntu
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stderr_logfile=/var/www/inventorio/var/log/messenger.err.log
stdout_logfile=/var/www/inventorio/var/log/messenger.out.log
